<title>Hidden Black Hole Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: a mission map of mini-games. Map = grid of mission tiles; a mission = one big night-sky stage + one short panel.
   Deliberately single-theme: everything happens in space at night. */
:root {
  color-scheme: dark;
  --sky: #111a3e;
  --sky-2: #1d2862;
  --panel: #1a2350;
  --line: #2f3b7a;
  --ink: #fff8ea;
  --ink-2: #c9cff2;
  --sun: #ffd23f;
  --btn-ink: #1b1442;
  --pink: #ff8fb1;
  --mint: #5fe0b7;
  --violet: #a58bff;
  --glow: #ff9f43;
  --gaia: #4fa3ff;
  --font-en: "Baloo 2", "Noto Sans SC", system-ui, sans-serif;
  --font-zh-head: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
html, body { background: var(--sky); color: var(--ink); }
[hidden] { display: none !important; }
body { font-family: var(--font-en); font-size: 20px; line-height: 1.45; }
:root[data-lang="zh"] body { font-family: var(--font-zh); }
.app { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; display: grid; gap: 14px; }

.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.top-left { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand { font-weight: 800; font-size: 20px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; text-align: left; }
:root[data-lang="zh"] .brand, :root[data-lang="zh"] h1, :root[data-lang="zh"] .tile .tt, :root[data-lang="zh"] .cert .who { font-family: var(--font-zh-head); font-weight: 400; }
.top-right { display: flex; gap: 10px; align-items: center; }
.count { display: inline-flex; gap: 6px; align-items: center; font-weight: 800; font-size: 18px; }
.starshape { width: 24px; height: 24px; display: inline-block; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: var(--sun); flex: none; }
.starshape.off { background: var(--line); }
.lang { display: inline-flex; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; color: var(--ink-2); font: 700 16px var(--font-en); padding: 6px 14px; border-radius: 999px; cursor: pointer; min-height: 40px; }
.lang button[lang="zh-Hans"] { font-family: var(--font-zh); }
.lang button[aria-pressed="true"] { background: var(--sun); color: var(--btn-ink); }
.homebtn { background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 16px; font-weight: 700; cursor: pointer; min-height: 44px; white-space: nowrap; }

/* map */
.hero { display: grid; gap: 6px; }
h1 { font-size: clamp(28px, 6vw, 42px); line-height: 1.1; margin: 0; font-weight: 800; text-wrap: balance; }
.lead { margin: 0; font-size: clamp(19px, 3.4vw, 23px); color: var(--ink-2); max-width: 44ch; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { position: relative; display: grid; gap: 6px; justify-items: start; align-content: start; text-align: left; background: var(--panel); border: 3px solid var(--line); border-radius: 22px; padding: 14px; color: var(--ink); cursor: pointer; min-height: 168px; }
.tile:hover { border-color: var(--ink-2); }
.tile .ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; }
.tile .ic svg { width: 46px; height: 46px; }
.tile .mn { font-size: 14px; color: var(--ink-2); font-weight: 700; }
.tile .tt { font-size: 20px; font-weight: 800; line-height: 1.15; }
.tile .done { position: absolute; top: 12px; right: 12px; }
.tile.wide { grid-column: 1 / -1; grid-template-columns: auto minmax(0, 1fr); align-items: center; min-height: 0; column-gap: 14px; }
.cert { display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--panel); border-radius: 22px; padding: 18px; border: 3px dashed var(--sun); }
.cert .who { font-size: clamp(24px, 5vw, 34px); font-weight: 800; color: var(--sun); line-height: 1.15; }
.cert .stars { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.cert input { font-size: 20px; font-weight: 600; font-family: inherit; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--sky); color: var(--ink); width: min(100%, 280px); text-align: center; }

/* mission */
.stage { position: relative; border-radius: 24px; overflow: hidden; background: radial-gradient(120% 90% at 50% 10%, var(--sky-2), var(--sky)); border: 2px solid var(--line); }
.stage canvas { display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
@media (max-width: 560px) { .stage canvas { aspect-ratio: 1 / 1; } }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 24px; padding: 18px 20px; display: grid; gap: 14px; }
.mnum { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.intro { margin: 0; font-size: clamp(19px, 3.4vw, 22px); max-width: 44ch; }
.status { margin: 0; font-size: clamp(20px, 3.6vw, 24px); font-weight: 800; color: var(--sun); min-height: 1.4em; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font-family: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.read { display: inline-flex; gap: 8px; align-items: center; background: transparent; color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 6px 16px 6px 10px; font-size: 17px; font-weight: 600; cursor: pointer; min-height: 44px; justify-self: start; }
.read svg { width: 24px; height: 24px; }
.big { background: var(--sun); color: var(--btn-ink); border: 0; border-radius: 18px; padding: 12px 22px; font-size: 21px; font-weight: 800; cursor: pointer; min-height: 56px; box-shadow: 0 4px 0 #c9a21c; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.big:active, .big.down { transform: translateY(3px); box-shadow: 0 1px 0 #c9a21c; }
.soft { background: transparent; color: var(--ink); border: 2px solid var(--line); border-radius: 18px; padding: 10px 18px; font-size: 19px; font-weight: 700; cursor: pointer; min-height: 56px; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.choice { display: grid; justify-items: center; gap: 6px; background: var(--sky); border: 3px solid var(--line); border-radius: 18px; padding: 10px 6px; color: var(--ink); font-size: 18px; font-weight: 700; cursor: pointer; min-height: 84px; align-content: center; line-height: 1.15; }
.choice[aria-pressed="true"] { border-color: var(--sun); }
.choice .ball { border-radius: 50%; display: block; }
.choice .ok { color: var(--mint); font-size: 15px; }
.meter { height: 18px; border-radius: 9px; background: var(--sky); border: 2px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--sun); border-radius: 0 9px 9px 0; transition: width .25s; }
input[type=range] { width: 100%; accent-color: var(--sun); height: 32px; }
.wow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; background: var(--sky); border: 3px solid var(--sun); border-radius: 20px; padding: 14px 16px; }
.wow .starshape { width: 48px; height: 48px; }
.wow .wt { font-weight: 800; font-size: 20px; color: var(--sun); }
.wow p { margin: 4px 0 0; font-size: 19px; }
.wow .row { grid-column: 1 / -1; }
details.grown { border-top: 2px dashed var(--line); padding-top: 10px; font-size: 15.5px; color: var(--ink-2); }
details.grown summary { cursor: pointer; font-weight: 700; font-size: 16px; }
details.grown p { margin: 8px 0 0; max-width: 70ch; }

/* wonder corner */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card { text-align: left; background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 14px 16px; color: var(--ink); cursor: pointer; display: grid; gap: 6px; font-size: 18px; min-height: 84px; }
.card .q { font-weight: 800; font-size: 19px; }
.card .a { color: var(--ink-2); }
.card[aria-expanded="true"] { border-color: var(--violet); }
footer { font-size: 13.5px; color: var(--ink-2); padding-top: 4px; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>

<div class="app">
  <div class="top">
    <div class="top-left">
      <button type="button" class="homebtn" id="home" hidden></button>
      <button type="button" class="brand" id="brand"></button>
    </div>
    <div class="top-right">
      <span class="count" id="count"></span>
      <div class="lang" role="group" aria-label="Language / 语言">
        <button type="button" id="lang-en" data-l="en" lang="en">English</button>
        <button type="button" id="lang-zh" data-l="zh" lang="zh-Hans">中文</button>
      </div>
    </div>
  </div>
  <div id="mapview" class="app" style="padding:0"></div>
  <div class="stage" id="stagebox" hidden><canvas id="stage"></canvas></div>
  <div class="panel" id="panel" hidden aria-live="polite"></div>
  <footer id="foot"></footer>
</div>

<script>
/* ===================================================================
   WORDS: every line in English and Chinese
   =================================================================== */
const T = {
  brand: ['Hidden Black Hole Hunt', '寻找隐藏的黑洞'],
  missions: ['Missions', '任务'],
  mapLead: ['Pick a mission! Each one shows you a secret about black holes.', '选一个任务！每个任务都会告诉你一个黑洞的秘密。'],
  missionN: ['Mission {n}', '任务 {n}'],
  starsOf: ['{n} of 8', '{n} / 8'],
  read: ['Read to me', '读给我听'],
  grown: ['For grown-ups', '给大人看'],
  youDid: ['You did it! You earned a detective star.', '你做到了！你得到了一颗侦探星星。'],
  nextMission: ['Next mission', '下一个任务'],
  backMap: ['Back to missions', '回到任务地图'],
  certTitle: ['You are a Black Hole Expert!', '你是黑洞小专家！'],
  certSoon: ['Finish all 8 missions to become a Black Hole Expert!', '完成全部 8 个任务，就能成为黑洞小专家！'],
  yourName: ['Write your name', '写下你的名字'],
  wonderT: ['Wonder corner', '好奇角'],
  wonderS: ['Big questions about black holes', '关于黑洞的大问题'],
  wonderLead: ['Tap a question to find out!', '点一个问题，看看答案！'],
  foot: ['Real facts from the ESA Gaia mission (Data Release 3), the Gaia BH1, BH2 and BH3 discovery papers, and the Event Horizon Telescope. The games use real physics ideas, made gentle so they are fun to play. Made for CS85, project 22.', '真实信息来自欧洲空间局 Gaia 任务（第三次数据发布）、Gaia BH1、BH2 和 BH3 的发现论文以及事件视界望远镜。游戏采用真实的物理原理，但做了简化，方便好玩。为 CS85 第 22 号项目制作。'],

  /* 1 squish */
  m1t: ['Make a black hole', '造一个黑洞'],
  m1i: ['A black hole starts as a giant star. When the star runs out of fuel, gravity squishes it super, super small.', '黑洞原本是一颗巨大的恒星。当它的燃料用完时，引力会把它挤得非常非常小。'],
  m1goal: ['Tap the star to squish it!', '点一点星星，把它挤小！'],
  m1btn: ['Squish!', '挤一挤！'],
  m1a: ['A giant old star, almost out of fuel.', '一颗燃料快用完的巨大老恒星。'],
  m1b: ['Gravity is squeezing it!', '引力在挤它！'],
  m1c: ['Smaller… and smaller…', '越来越小……越来越小……'],
  m1d: ['Poof! Now it is a black hole!', '噗！它变成了黑洞！'],
  m1w: ['If you squished the whole Earth like that, it would be as small as a marble!', '如果把整个地球也这样挤，它会变得像一颗弹珠那么小！'],
  m1n: ['Stars many times heavier than the Sun can collapse into black holes when they run out of fuel. To become a black hole, Earth would have to be squeezed to about 2 cm across (its Schwarzschild radius is about 9 mm).', '比太阳重很多倍的恒星在燃料耗尽时可能坍缩成黑洞。地球要变成黑洞，得被压缩到直径约 2 厘米（它的史瓦西半径约 9 毫米）。'],

  /* 2 escape */
  m2t: ['Escape challenge', '逃跑挑战'],
  m2i: ['Gravity pulls things back down. To escape, you have to go really, really fast.', '引力会把东西拉回来。想要逃走，你必须飞得非常非常快。'],
  m2goal: ['Pick a place. Hold the button, then let go to launch!', '选一个地方。按住按钮，松开就发射！'],
  m2hint: ['Escape from the Moon and Earth, then try the black hole.', '先从月球和地球逃走，再试试黑洞。'],
  moon: ['Moon', '月球'], earth: ['Earth', '地球'], bhole: ['Black hole', '黑洞'],
  hold: ['Hold to launch', '按住发射'],
  holdHere: ['Press and hold here!', '在这里按住！'],
  power: ['Power', '力量'],
  m2yes: ['You escaped!', '成功逃走！'],
  m2no: ['Not fast enough. It fell back down!', '速度不够，掉下来了！'],
  m2bh: ['Nothing is fast enough! Even light falls back in.', '什么都不够快！连光都会掉回去。'],
  wayUp: ['way up here!', '要到这么高！'],
  m2w: ['Light is the fastest thing there is. But even light can\'t escape a black hole. That\'s why it looks black!', '光是世界上最快的东西。但连光都逃不出黑洞，所以它看起来是黑色的！'],
  m2n: ['Escape speed is about 2.4 km/s from the Moon and 11.2 km/s from Earth. At a black hole\'s event horizon it equals the speed of light, about 300,000 km/s, so nothing can get out.', '从月球逃逸需要约 2.4 公里/秒，从地球需要约 11.2 公里/秒。在黑洞的事件视界处，逃逸速度等于光速（约 30 万公里/秒），所以什么都出不来。'],

  /* 3 orbit */
  m3t: ['Orbit playground', '绕圈游乐场'],
  m3i: ['Does a black hole suck up everything like a vacuum cleaner? Let\'s test it!', '黑洞会像吸尘器一样把所有东西都吸进去吗？我们来试试！'],
  m3goal: ['Tap to throw a star sideways, or drag to throw it your own way. Get 3 stars going round!', '点一下，把星星往旁边扔；或者拖一拖，按你的方向扔。让 3 颗星星绕着转！'],
  m3count: ['Stars going round: {n} of 3', '正在绕圈的星星：{n} / 3'],
  m3gulp: ['Gulp! That one went straight in.', '咕嘟！那颗直接掉进去了。'],
  m3hint: ['Tip: throw sideways, not straight at it!', '小提示：往旁边扔，不要直接对着它扔！'],
  m3w: ['No vacuum cleaner! Stars that move sideways just go round and round, like Earth goes round the Sun.', '黑洞不是吸尘器！往旁边运动的星星只会一圈圈地转，就像地球绕着太阳转一样。'],
  m3n: ['Far from a black hole, its gravity is the same as any object of the same mass. If the Sun were swapped for a black hole of equal mass, Earth\'s orbit would not change (it would just get very cold and dark).', '在离黑洞较远的地方，它的引力和同样质量的任何天体一样。如果把太阳换成同样质量的黑洞，地球的轨道不会改变（只是会变得又冷又黑）。'],

  /* 4 pilot */
  m4t: ['Space pilot', '太空飞行员'],
  m4i: ['Around every black hole is an invisible line called the event horizon. Cross it, and you can never come back!', '每个黑洞周围都有一条看不见的线，叫做事件视界。一旦越过它，就再也回不来了！'],
  m4goal: ['Press and drag to fly. Collect all 8 stardust sparkles, but don\'t cross the orange line!', '按住并拖动来飞行。收集全部 8 颗星尘，但不要越过橙色的线！'],
  m4count: ['Stardust: {n} of 8', '星尘：{n} / 8'],
  m4oops: ['Oops! Past the point of no return. Try again!', '哎呀！越过了不归点。再试一次！'],
  noReturn: ['point of no return', '不归点'],
  m4w: ['Great flying! Outside the event horizon you can still get away. Inside it, nothing ever comes back out, not even light.', '飞得真棒！在事件视界外面还能逃走；进到里面，什么都出不来，连光也不行。'],
  m4n: ['The event horizon is the boundary where the escape speed reaches the speed of light. In this game the pull is made gentle so it can be played.', '事件视界是逃逸速度达到光速的边界。在这个游戏里，引力被调得比较温和，方便玩。'],

  /* 5 noodle */
  m5t: ['Noodle stretch', '拉面条'],
  m5i: ['Near a black hole, gravity pulls the near side much harder than the far side. What happens?', '在黑洞附近，引力拉近的一边比远的一边用力得多。会发生什么呢？'],
  m5goal: ['Drag it closer to the black hole!', '把它拖得离黑洞近一点！'],
  astro: ['Astronaut', '宇航员'], donut: ['Donut', '甜甜圈'],
  closer: ['Move closer', '靠近一点'],
  m5count: ['Stretchiness: ×{n}', '拉长：×{n}'],
  noodleZone: ['noodle zone', '面条区'],
  m5w: ['It got stretched like a noodle! Scientists really call this "spaghettification".', '它被拉得像面条一样长！科学家真的把这叫做"意大利面条化"。'],
  m5n: ['This is the tidal force: the difference in gravity between the near and far side. It is strongest near small black holes. Near a giant black hole you could cross the horizon before being stretched.', '这就是潮汐力：近的一边和远的一边受到的引力之差。在小黑洞附近它最强；而在巨大的黑洞附近，你可能在被拉长之前就已经越过了视界。'],

  /* 6 weigh */
  m6t: ['Weigh a black hole', '称一称黑洞'],
  m6i: ['Black holes are heavy! Let\'s weigh them using Suns.', '黑洞非常重！我们用太阳来称一称它们。'],
  m6goal: ['Add Suns until the seesaw is level.', '放上太阳，直到跷跷板变平。'],
  plus1: ['+1 Sun', '+1 个太阳'], minus1: ['−1 Sun', '−1 个太阳'], plus10: ['+10 Suns', '+10 个太阳'],
  m6heavy: ['The black hole is heavier. Add more Suns!', '黑洞更重，再加一些太阳！'],
  m6many: ['Too many Suns! Take some off.', '太阳太多了！拿掉一些。'],
  m6bal: ['Balanced! {name} weighs about {n} Suns!', '平衡了！{name} 大约有 {n} 个太阳那么重！'],
  m6next: ['Weigh a bigger one', '称一个更大的'],
  m6bag: ['Tip: a bag holds 10 Suns.', '小提示：一袋装有 10 个太阳。'],
  m6w: ['The giant black hole in the middle of our galaxy weighs about 4 million Suns! That would need a really, really big seesaw.', '银河系中心的巨大黑洞大约有 400 万个太阳那么重！那得要一个超级超级大的跷跷板。'],
  m6n: ['Gaia BH1 is about 9.6 Suns and Gaia BH3 about 33 Suns, the heaviest known star-sized black hole in our galaxy. Sagittarius A*, at the centre of the Milky Way, is about 4 million Suns.', 'Gaia BH1 约 9.6 个太阳质量，Gaia BH3 约 33 个太阳质量，是银河系中已知最重的恒星级黑洞。银河系中心的人马座 A* 约有 400 万个太阳质量。'],

  /* 7 dance */
  m7t: ['Dancing stars', '跳舞的星星'],
  m7i: ['Stars often dance in pairs, holding each other with gravity. Meet Stella!', '星星常常两两跳舞，用引力手拉着手。来认识小星吧！'],
  g0: ['Pick a dance friend for Stella!', '给小星选一个舞伴！'],
  g1: ['Try a different friend!', '再换一个舞伴试试！'],
  g2: ['Heavier friend, bigger circle! Now pick the black hole.', '舞伴越重，圈越大！现在选黑洞。'],
  g3: ['Where did the friend go? Put on detective glasses!', '舞伴去哪儿了？戴上侦探眼镜！'],
  g5: ['Found it! Now compare two star friends too.', '找到了！再比较一下两个星星舞伴。'],
  small: ['Small', '小'], bigf: ['Big', '大'], giant: ['Giant', '超大'],

    ctx.fillStyle = '#c9cff2'; ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(cx - M() * .07, H * .95); ctx.lineTo(cx + M() * .07, H * .95); ctx.fill();
    const ex = Math.cos(ms.ang) * L / 2, ey = Math.sin(ms.ang) * L / 2;
    ctx.strokeStyle = '#fff8ea'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx - ex, py - ey); ctx.lineTo(cx + ex, py + ey); ctx.stroke();
    const lx = cx - ex, ly = py - ey, rx = cx + ex, ry = py + ey, pw = M() * .22, drop = M() * .06;
    [[lx, ly], [rx, ry]].forEach(([x, y]) => { ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - pw / 2, y + drop); ctx.moveTo(x, y); ctx.lineTo(x + pw / 2, y + drop); ctx.stroke();
      ctx.fillStyle = '#c9cff2'; ctx.fillRect(x - pw / 2, y + drop, pw, 6); });
    // left: the black hole
    const br = M() * .065; drawBlackHole(lx, ly + drop - br, br);
    text(sc.name, lx, ly + drop - br * 3.1, Math.max(14, M() * .04));
    // right: the Suns, in bags of 10 when the round uses bags
    const bags = sc.bag ? Math.floor(ms.suns / 10) : 0, ones = Math.min(sc.bag ? ms.suns % 10 : ms.suns, 20), sr = M() * .02;
    let x = rx - pw / 2 + sr * 1.3, y = ry + drop - sr * 1.1;
    for (let i = 0; i < bags; i++) { const bx = rx - pw / 2 + pw * (i + .5) / Math.max(4, bags), by = ry + drop - M() * .045;
      ctx.fillStyle = '#c98a3a'; ctx.beginPath(); ctx.ellipse(bx, by + M() * .012, M() * .03, M() * .035, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.max(11, M() * .028)}px "Baloo 2", sans-serif`; ctx.textAlign = 'center'; ctx.fillText('10', bx, by + M() * .022); }
    if (bags) y -= M() * .08;
    for (let i = 0; i < ones; i++) { const col = i % 5, row = Math.floor(i / 5);
      drawBall(rx - pw / 2 + sr * 1.6 + col * (pw - sr * 3.2) / 4, y - row * sr * 2.1, sr, '#ffd23f'); }
    text(String(ms.suns), rx, ry - M() * .02 - (bags ? M() * .08 : 0) - Math.ceil(ones / 5) * sr * 2.1 - sr, Math.max(22, M() * .07), '#ffd23f');
    const balanced = ms.suns === sc.target;
    if (balanced && !ms.bal) { ms.bal = true; burst(cx, py, 30); renderControls(); if (ms.round === 1 && !app.earned.has(this.id)) setTimeout(() => win(), 900); }
    if (!balanced && ms.bal) { ms.bal = false; renderControls(); }
  },
  status() {
    const sc = SCALES[ms.round];
    if (ms.suns === sc.target) return t('m6bal', { name: sc.name, n: sc.target });
    if (ms.suns === 0) return t('m6goal');
    return t(ms.suns < sc.target ? 'm6heavy' : 'm6many');
  },
  controls() {
    const sc = SCALES[ms.round];
    let html = `<div class="row"><button type="button" class="big" data-add="1">${t('plus1')}</button>${sc.bag ? `<button type="button" class="big" data-add="10">${t('plus10')}</button>` : ''}<button type="button" class="soft" data-add="-1">${t('minus1')}</button></div>`;
    if (sc.bag) html += `<p class="intro" style="font-size:18px;color:var(--ink-2)">${t('m6bag')}</p>`;
    if (ms.bal && ms.round === 0) html += `<div class="row"><button type="button" class="big pulse" id="bigger">${t('m6next')}</button></div>`;
    return html;
  },
  wire() {
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { ms.suns = clamp(ms.suns + +b.dataset.add, 0, 60); });
    if ($('#bigger')) $('#bigger').onclick = () => { ms.round = 1; ms.suns = 0; ms.bal = false; renderControls(); };
  },
  down(x) { if (x > W / 2) ms.suns = Math.min(60, ms.suns + 1); },
};

/* ---------- 7. Dancing stars ---------- */
const FRIENDS = { small: { m: .4, r: .045, color: '#ff8fb1', px: 22 }, bigf: { m: 1.5, r: .07, color: '#a58bff', px: 34 }, giant: { m: 5, r: .1, color: '#5fe0b7', px: 46 } };
const dance = {
  id: 'dance', title: 'm7t', intro: 'm7i', wow: 'm7w', note: 'm7n', color: '#a58bff',
  icon: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="14" fill="none" stroke="#ffd23f" stroke-width="2.5" stroke-dasharray="3 4"/><circle cx="14" cy="16" r="6" fill="#ffd23f"/><circle cx="33" cy="31" r="4" fill="#a58bff"/></svg>',
  init() { ms = { friend: null, tried: new Set(), glasses: false, bhPos: { x: 0, y: 0 } }; },
  draw() {
    const m = M(), cx = W / 2, cy = H / 2, sp = reduce ? .6 : 1;
    if (!ms.friend) drawStar(cx, cy + Math.sin(app.t * 2) * 4, m * .11, '#ffd23f', { tilt: Math.sin(app.t * 2) * .1 });
    else if (ms.friend === 'bh') { const p = pair(cx, cy, m * .3, 6, m * .09, '#ffd23f', { kind: ms.glasses ? 'glasses' : 'hidden', r: m * .07 }, 1.2 * sp); ms.bhPos = { x: p.px, y: p.py }; }
    else { const f = FRIENDS[ms.friend]; pair(cx, cy, m * .3, f.m, m * .09, '#ffd23f', { kind: 'ball', r: m * f.r, color: f.color }, 1.2 * sp); }
    if (ms.friend === 'bh' && ms.glasses && ms.tried.size >= 2 && !app.earned.has(this.id) && !ms.winning) { ms.winning = true; setTimeout(() => win(), 1300); }
  },
  status() {
    const n = ms.tried.size;
    if (!ms.friend) return t('g0');
    if (ms.friend !== 'bh') return t(n < 2 ? 'g1' : 'g2');
    if (!ms.glasses) return t('g3');
    return t(n >= 2 ? 'yay' : 'g5');
  },
  controls() {
    const btns = Object.keys(FRIENDS).map(k => `<button type="button" class="choice" data-friend="${k}" aria-pressed="${ms.friend === k}"><span class="ball" style="width:${FRIENDS[k].px}px;height:${FRIENDS[k].px}px;background:${FRIENDS[k].color}"></span>${t(k)}</button>`).join('')
      + `<button type="button" class="choice" data-friend="bh" aria-pressed="${ms.friend === 'bh'}"><span class="ball" style="width:40px;height:40px;background:#05030f;box-shadow:0 0 0 3px #ff9f43"></span>${t('bhole')}</button>`;
    const gl = ms.friend === 'bh' ? `<div class="row"><button type="button" class="big ${ms.glasses ? '' : 'pulse'}" id="glasses">${t(ms.glasses ? 'glassesOff' : 'glassesOn')}</button></div>` : '';
    return `<div class="choices">${btns}</div>${gl}`;
  },
  wire() {
    document.querySelectorAll('[data-friend]').forEach(b => b.onclick = () => { ms.friend = b.dataset.friend; if (ms.friend !== 'bh') ms.tried.add(ms.friend); else ms.glasses = false; renderControls(); });
    if ($('#glasses')) $('#glasses').onclick = () => this.toggleGlasses();
  },
  toggleGlasses() { ms.glasses = !ms.glasses; if (ms.glasses) burst(ms.bhPos.x, ms.bhPos.y, 20); renderControls(); },
  down() { if (ms.friend === 'bh') this.toggleGlasses(); },
};

/* ---------- 8. Detective game ---------- */
const ROUNDS = [['still', 'bh', 'still'], ['visible', 'bh', 'still'], ['glitch', 'bh', 'visible']];
const SLOT_COLORS = [['pink', '#ff8fb1'], ['mint', '#5fe0b7'], ['yellow', '#ffd23f']];
const REAL20 = Array.from({ length: 20 }, (_, i) => i === 16 ? 'bh1' : i === 18 ? 'bh2' : 'mystery');   // ranks 17 and 19 in the real Gaia list
const detect = {
  id: 'detect', title: 'm8t', intro: 'm8i', wow: 'm8w', note: 'm8n', color: '#c9cff2',
  icon: '<svg viewBox="0 0 48 48"><circle cx="21" cy="21" r="11" fill="none" stroke="#fff" stroke-width="4"/><path d="M29 29l11 11" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="21" cy="21" r="4" fill="#05030f" stroke="#ff9f43" stroke-width="2.5"/></svg>',
  init() { ms = { round: 0, layout: [], solved: [false, false, false], fb: null, nope: { slot: -1, until: 0 }, gaia: false, picked: null, pi: -1, cells: [], slotPos: [] }; this.newRound(0); },
  newRound(r) {
    ms.round = r; ms.fb = null; const k = ROUNDS[r].slice();
    for (let i = k.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [k[i], k[j]] = [k[j], k[i]]; }
    ms.layout = k;
  },
  draw() {
    if (ms.gaia) return this.drawGaia();
    const slotW = W / 3, s = Math.min(slotW, H), sp = reduce ? .6 : 1;
    ms.layout.forEach((kind, i) => {
      const x = slotW * (i + .5), y = H * .52, color = SLOT_COLORS[i][1], size = s * .16, A = s * .3;
      const nope = ms.nope.slot === i && app.t < ms.nope.until, o = { seed: i, mood: nope ? 'oops' : 'happy', tilt: nope ? Math.sin(app.t * 40) * .25 : 0 };
      if (kind === 'still') { drawStar(x, y + Math.sin(app.t * 1.5 + i) * 2, size, color, o); ms.slotPos[i] = { x, y }; }
      else if (kind === 'bh') { const p = pair(x, y, A, 6, size, color, { kind: ms.solved[ms.round] ? 'revealed' : 'hidden', r: s * .06 }, 1.3 * sp, i); ms.slotPos[i] = { x: p.px, y: p.py }; }
      else if (kind === 'visible') { pair(x, y, A * .9, 1.2, size, color, { kind: 'ball', r: s * .07, color: '#ffffff' }, 1.1 * sp, i * 2); ms.slotPos[i] = { x, y }; }
      else { const k = Math.floor(app.t * (reduce ? 3 : 9)), jx = (Math.sin(k * 12.9898 + i) * 43758.5453 % 1) * A * .5, jy = (Math.sin(k * 78.233 + i) * 12345.678 % 1) * A * .5;
        drawStar(x + jx, y + jy, size, color, o); ms.slotPos[i] = { x, y }; }
    });
  },
  drawGaia() {
    const top = H * .28, gx = W / 2, gs = M() * .12, gy = top * .45;
    ctx.fillStyle = '#e9b44c'; ctx.beginPath(); ctx.ellipse(gx, gy + gs * .25, gs, gs * .28, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#c9cff2'; ctx.fillRect(gx - gs * .3, gy - gs * .35, gs * .6, gs * .55);
    ctx.fillStyle = '#1b1442'; ctx.beginPath(); ctx.arc(gx + gs * .12, gy - gs * .05, gs * .1, 0, 7); ctx.fill();
    text('Gaia', gx + gs * 1.25, gy + gs * .35, Math.max(14, gs * .3), '#fff8ea', 'left');
    const cols = 5, rows = 4, x0 = W * .08, y0 = top + 6, cw = (W * .84) / cols, ch = (H - y0 - 10) / rows;
    const sweep = x0 + ((app.t * .25) % 1) * cols * cw;
    ctx.fillStyle = '#4fa3ff14'; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(sweep - cw * .6, H); ctx.lineTo(sweep + cw * .6, H); ctx.closePath(); ctx.fill();
    ms.cells = [];
    REAL20.forEach((kind, i) => {
      const x = x0 + cw * (i % cols + .5), y = y0 + ch * (Math.floor(i / cols) + .5), s = Math.min(cw, ch) * .24, sel = ms.pi === i;
      ms.cells.push({ x, y, w: cw, h: ch, kind, i });
      if (kind === 'mystery') drawStar(x, y, s * (sel ? 1.1 : .9), '#8f98c9', { seed: i });
      else { drawStar(x, y, s * 1.15 * (1 + .08 * Math.sin(app.t * 4 + i)) * (sel ? 1.15 : 1), '#4fa3ff', { seed: i });
        if (sel) text(kind === 'bh1' ? 'Gaia BH1' : 'Gaia BH2', x, y + s * 2.1, Math.max(12, s * .7)); }
    });
  },
  status() {
    if (ms.gaia) return ms.picked ? t(ms.picked) : t('tapBlue');
    if (ms.fb) return t(ms.fb);
    return t('round', { n: ms.round + 1 }) + (app.lang === 'zh' ? '：' : '. ') + t(['r1', 'r2', 'r3'][ms.round]);
  },
  controls() {
    if (ms.gaia) return '';
    const btns = SLOT_COLORS.map(([k, c], i) => `<button type="button" class="choice" data-slot="${i}"><span class="ball" style="width:22px;height:22px;background:${c}"></span>${t(k)}</button>`).join('');
    const nxt = ms.solved[ms.round] && ms.round < 2 ? `<div class="row"><button type="button" class="big pulse" id="next-round">${t('nextRound')}</button></div>` : '';
    return `<p class="intro">${t('ask')}</p><div class="choices">${btns}</div>${nxt}`;
  },
  wire() {
    document.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => this.pick(+b.dataset.slot));
    if ($('#next-round')) $('#next-round').onclick = () => { this.newRound(ms.round + 1); renderControls(); };
  },
  pick(i) {
    if (ms.gaia || ms.solved[ms.round]) return;
    const kind = ms.layout[i];
    if (kind === 'bh') {
      ms.solved[ms.round] = true; ms.fb = 'yay'; const p = ms.slotPos[i]; if (p) burst(p.x, p.y, 40); speak(t('yay'));
      if (ms.round === 2) setTimeout(() => { ms.gaia = true; win(); }, 1500);
    } else { ms.fb = kind; ms.nope = { slot: i, until: app.t + .6 }; speak(t(kind)); }
    renderControls();
  },
  down(x, y) {
    if (!ms.gaia) return this.pick(Math.min(2, Math.floor(x / (W / 3))));
    const c = ms.cells.find(c => Math.abs(x - c.x) < c.w / 2 && Math.abs(y - c.y) < c.h / 2);
    if (c) { ms.picked = c.kind; ms.pi = c.i; if (c.kind !== 'mystery') burst(c.x, c.y, 24); speak(t(c.kind)); }
  },
};

const MISSIONS = [squish, escape, orbit, pilot, noodle, weigh, dance, detect];
const cur = () => MISSIONS[app.mi];

/* ===================================================================
   SCREENS
   =================================================================== */
function renderTop() {
  root.dataset.lang = app.lang; root.lang = app.lang === 'zh' ? 'zh-Hans' : 'en';
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === app.lang));
  $('#brand').textContent = t('brand');
  $('#count').innerHTML = `<i class="starshape"></i>${t('starsOf', { n: app.earned.size })}`;
  const home = $('#home'); home.hidden = app.screen === 'map'; home.textContent = '← ' + t('missions');
  $('#foot').textContent = t('foot');
}
function renderMap() {
  const tiles = MISSIONS.map((m, i) => `<button type="button" class="tile" data-mission="${i}">
      <span class="ic" style="background:${m.color}33">${m.icon}</span>
      <span class="mn">${t('missionN', { n: i + 1 })}</span><span class="tt">${t(m.title)}</span>
      <i class="starshape done ${app.earned.has(m.id) ? '' : 'off'}" aria-label="${app.earned.has(m.id) ? 'done' : 'not yet'}"></i></button>`).join('');
  const wonder = `<button type="button" class="tile wide" id="wonder"><span class="ic" style="background:#a58bff33"><svg viewBox="0 0 48 48"><path d="M17 17a7 7 0 1 1 10 6c-2 1-3 3-3 5v2" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="37" r="2.6" fill="#fff"/></svg></span>
      <span style="display:grid;gap:2px"><span class="tt">${t('wonderT')}</span><span class="mn">${t('wonderS')}</span></span></button>`;
  const all = app.earned.size >= MISSIONS.length;
  const cert = `<div class="cert">
      <div class="stars">${MISSIONS.map(m => `<i class="starshape ${app.earned.has(m.id) ? '' : 'off'}"></i>`).join('')}</div>
      <div class="who" id="who">${all ? (app.name ? esc(app.name) + (app.lang === 'zh' ? '，' : ', ') : '') + t('certTitle') : t('certSoon')}</div>
      ${all ? `<label for="kid-name" style="font-size:16px;color:var(--ink-2)">${t('yourName')}</label><input id="kid-name" maxlength="24" autocomplete="off" value="${esc(app.name)}">` : ''}
    </div>`;
  $('#mapview').innerHTML = `<div class="hero"><h1>${t('brand')}</h1><p class="lead">${t('mapLead')}</p></div>
    <div class="tiles">${tiles}${wonder}</div>${cert}`;
  document.querySelectorAll('[data-mission]').forEach(b => b.onclick = () => openMission(+b.dataset.mission));
  $('#wonder').onclick = () => { app.screen = 'wonder'; render(); };
  const nm = $('#kid-name');
  if (nm) nm.oninput = () => { app.name = nm.value; try { localStorage.setItem('bhh-name', app.name); } catch (e) {}
    $('#who').innerHTML = (app.name ? esc(app.name) + (app.lang === 'zh' ? '，' : ', ') : '') + t('certTitle'); };
}
function renderWonder() {
  const cards = [1, 2, 3, 4, 5, 6, 7].map(n => { const open = app.open.has(n);
    return `<button type="button" class="card" data-card="${n}" aria-expanded="${open}"><span class="q">${t('q' + n)}</span>${open ? `<span class="a">${t('a' + n)}</span>` : ''}</button>`; }).join('');
  $('#mapview').innerHTML = `<div class="hero"><h1>${t('wonderT')}</h1><p class="lead">${t('wonderLead')}</p></div><div class="cards">${cards}</div>`;
  document.querySelectorAll('[data-card]').forEach(b => b.onclick = () => { const n = +b.dataset.card;
    app.open.has(n) ? app.open.delete(n) : app.open.add(n); if (app.open.has(n)) speak(t('q' + n) + ' ' + t('a' + n)); renderWonder(); });
}
function renderPanel() {
  const m = cur(), won = ms.won;
  const wow = won ? `<div class="wow"><i class="starshape"></i><div><div class="wt">${t('youDid')}</div><p>${t(m.wow)}</p></div>
      <div class="row">${app.mi < MISSIONS.length - 1 ? `<button type="button" class="big pulse" id="next-m">${t('nextMission')}</button>` : ''}<button type="button" class="soft" id="to-map">${t('backMap')}</button></div></div>` : '';
  $('#panel').innerHTML = `<div><div class="mnum">${t('missionN', { n: app.mi + 1 })}</div><h1>${t(m.title)}</h1></div>
    ${wow}
    <p class="status" id="status"></p>
    <div id="controls" style="display:grid;gap:12px">${m.controls()}</div>
    <p class="intro">${t(m.intro)}</p>
    ${readBtn()}
    <details class="grown"><summary>${t('grown')}</summary><p>${t(m.note)}</p></details>`;
  m.wire();
  if ($('#read')) $('#read').onclick = () => speak(won ? t('youDid') + ' ' + t(m.wow) : [t(m.title), t(m.intro), m.status()].join(' '));
  if ($('#next-m')) $('#next-m').onclick = () => openMission(app.mi + 1);
  if ($('#to-map')) $('#to-map').onclick = () => { app.screen = 'map'; render(); };
  lastStatus = null; refreshStatus();
}
function renderControls() { const c = $('#controls'); if (c) { c.innerHTML = cur().controls(); cur().wire(); } refreshStatus(); }
let lastStatus = null;
function refreshStatus() {
  const el = $('#status'); if (!el) return;
  const s = statusFlash.key && app.t < statusFlash.until ? t(statusFlash.key) : cur().status();
  if (s !== lastStatus) { lastStatus = s; el.textContent = s; }
}
function render() {
  hush(); renderTop();
  const inMission = app.screen === 'mission';
  $('#mapview').hidden = inMission; $('#stagebox').hidden = !inMission; $('#panel').hidden = !inMission;
  if (app.screen === 'map') renderMap(); else if (app.screen === 'wonder') renderWonder(); else renderPanel();
}
function openMission(i) {
  app.screen = 'mission'; app.mi = i; sparks = []; cheer = 0; statusFlash = { key: null, until: 0 };
  cur().init(); render(); requestAnimationFrame(resize);
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}
function win() {
  if (app.screen !== 'mission') return;
  const m = cur(); ms.won = true;
  if (!app.earned.has(m.id)) { app.earned.add(m.id); saveEarned(); }
  cheer = 2.5; burst(W / 2, H * .22, 40);
  renderTop(); renderPanel();
}
$('#home').onclick = () => { app.screen = 'map'; render(); };
$('#brand').onclick = () => { app.screen = 'map'; render(); };
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  app.lang = b.dataset.l; try { localStorage.setItem('bhh-lang', app.lang); } catch (e) {} render();
});

/* pointer + keyboard input on the stage */
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => { if (app.screen !== 'mission') return; try { cv.setPointerCapture(e.pointerId); } catch (_) {} const m = cur(); if (m.down) m.down(...pos(e)); });
cv.addEventListener('pointermove', e => { if (app.screen === 'mission' && cur().move) cur().move(...pos(e)); });
const upH = e => { if (app.screen === 'mission' && cur().up) cur().up(...pos(e)); };
cv.addEventListener('pointerup', upH); cv.addEventListener('pointercancel', upH);
addEventListener('keydown', e => { if (app.screen === 'mission' && cur().key && cur().key(e.key, true)) e.preventDefault(); });
addEventListener('keyup', e => { if (app.screen === 'mission' && cur().key) cur().key(e.key, false); });

/* main loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; app.t += dt;
  if (app.screen === 'mission' && W) { sky(); cur().draw(dt); drawSparks(dt); drawCheer(dt); refreshStatus(); }
  requestAnimationFrame(frame);
}
render(); requestAnimationFrame(frame);
</script>
